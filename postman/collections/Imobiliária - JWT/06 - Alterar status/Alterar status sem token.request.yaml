$kind: http-request
method: PATCH
url: '{{baseUrl}}/imoveis/{{imovelId}}/status'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "VENDIDO"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401", function () {
          pm.response.to.have.status(401);
      });
