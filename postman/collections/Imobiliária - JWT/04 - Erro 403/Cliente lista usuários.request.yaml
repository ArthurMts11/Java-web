$kind: http-request
method: GET
url: '{{baseUrl}}/api/usuarios'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tokenCliente}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403", function () {
          pm.response.to.have.status(403);
      });
