$kind: http-request
method: DELETE
url: '{{baseUrl}}/imoveis/{{imovelId}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tokenCliente}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403", function () {
          pm.response.to.have.status(403);
      });
