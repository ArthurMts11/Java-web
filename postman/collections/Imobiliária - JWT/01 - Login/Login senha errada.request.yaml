$kind: http-request
method: POST
url: '{{baseUrl}}/public/login'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "senha": "errada"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401", function () {
          pm.response.to.have.status(401);
      });
