$kind: http-request
method: GET
url: '{{baseUrl}}/api/usuarios'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: abc.def.ghi
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401", function () {
          pm.response.to.have.status(401);
      });
