spring.application.name=projeto2

# Datasource (mesmos valores que estavam hard-coded em dao/Conexao.java)
spring.datasource.url=jdbc:mysql://127.0.0.1:8889/pw4?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# As JSPs continuam em src/main/webapp/ na raiz, com os mesmos nomes de sempre
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp

# Upload de fotos dos imóveis (salvas em disco, servidas em /uploads/**)
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# E-mail (Gmail via SMTP). Credenciais vêm de variáveis de ambiente, nunca
# escritas aqui: MAIL_USER (seu Gmail) e MAIL_PASSWORD (senha de app do Google).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Thymeleaf só gera o HTML dos e-mails (templates/email/). Restringir os
# nomes de view impede que ele intercepte as JSPs (ex.: "index", "admin/index").
spring.thymeleaf.view-names=email/*

# Nome da imobiliária usado nos e-mails enviados aos clientes. O Spring Boot
# lê este arquivo como ISO-8859-1: acentos precisam ir como \uXXXX (á = \u00e1).
app.imobiliaria.nome=Imobili\u00e1ria Fogami
app.imobiliaria.telefone=(55) 3333-0000
app.imobiliaria.email=${MAIL_USER:contato@imobiliaria.com}

# Destinatário fixo do GET /teste-email
app.email-teste=arthurmtsmts@gmail.com

# JWT da API REST. A chave vem da variável de ambiente JWT_SECRET (mínimo de
# 32 caracteres); sem ela o sistema gera uma chave temporária a cada start.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-minutos=120
